<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer Admin · ISA ERP</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='252') }}"><link rel="stylesheet" href="{{ url_for('static', filename='colors.css', v='252') }}"></head><body class="login-page"><section class="login-card"><div class="brand"><span>ISA</span><small>ERP V25.2 · PASSWORD RESET</small></div><h1>Créer le compte Admin</h1><p>Choisissez votre mot de passe personnel.</p>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="flash">{{ msg }}</div>{% endfor %}{% endwith %}<form method="post"><label><span>E-mail Admin</span><input type="email" name="email" value="{{ admin_email }}" readonly required></label><label><span>Mot de passe</span><input type="password" name="password" minlength="8" required autofocus></label><label><span>Confirmer le mot de passe</span><input type="password" name="password_confirmation" minlength="8" required></label><button class="primary">Créer mon compte Admin</button></form><p class="login-help"><a href="{{ url_for('login') }}">Retour à la connexion</a></p></section></body></html>
