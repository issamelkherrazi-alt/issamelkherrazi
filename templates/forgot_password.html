<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mot de passe oublié · ISA ERP</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='252') }}"><link rel="stylesheet" href="{{ url_for('static', filename='colors.css', v='252') }}"></head><body class="login-page"><section class="login-card"><div class="brand"><span>ISA</span><small>ERP V25.2 · PASSWORD RESET</small></div><h1>Mot de passe oublié</h1>{% if sent %}<div class="flash">Si ce compte existe, un lien a été envoyé. Vérifiez aussi le dossier Spam.</div><p><a href="{{ url_for('login') }}">Retour à la connexion</a></p>{% else %}<p>Entrez votre e-mail pour recevoir un lien sécurisé.</p><form method="post"><label><span>E-mail</span><input type="email" name="email" value="{{ admin_email }}" required autofocus></label><button class="primary">Envoyer le lien</button></form><p class="login-help"><a href="{{ url_for('login') }}">Retour à la connexion</a></p>{% endif %}</section></body></html>
