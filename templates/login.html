<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion · ISA ERP</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='252') }}"><link rel="stylesheet" href="{{ url_for('static', filename='colors.css', v='252') }}"><style>body.login-page{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf3f8;font:14px Arial,sans-serif;color:#14233a}.login-card{width:320px;box-sizing:border-box;background:#fff;border-radius:16px;padding:30px;box-shadow:0 18px 50px #17345d18}.brand{margin-bottom:34px}.brand span{display:block;color:#4896f5;font-size:25px;font-weight:800}.brand small{color:#7184a2;font-size:8px;font-weight:800;letter-spacing:1.3px}.login-card h1{font-size:22px;margin:0 0 8px}.login-card p{margin:0 0 18px}.login-card form{display:grid;gap:14px}.login-card label{display:grid;gap:7px}.login-card input{box-sizing:border-box;width:100%;height:38px;border:1px solid #bdd0e6;border-radius:7px;padding:8px;font-size:14px}.login-card input:focus{outline:2px solid #166ce5;border-color:#166ce5}.login-card button{height:38px;border:0;border-radius:7px;background:#196be3;color:#fff;font-weight:800}.login-help{text-align:center;margin:14px 0 0!important}.login-help a{color:#0965dc;font-weight:700}</style></head><body class="login-page"><section class="login-card"><div class="brand"><span>ISA</span><small>ERP V25.2 · PASSWORD RESET</small></div><h1>Connexion</h1><p>Accès réservé à l'équipe ISA</p>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="flash">{{ msg }}</div>{% endfor %}{% endwith %}<form method="post"><label><span>E-mail</span><input type="email" name="email" required autofocus></label><label><span>Mot de passe</span><input type="password" name="password" required></label><button class="primary">Se connecter</button></form><p class="login-help"><a href="{{ url_for('forgot_password') }}">Mot de passe oublié ?</a></p><p class="login-help">Première utilisation ? <a href="{{ url_for('register_admin') }}">Créer le compte Admin</a></p></section></body></html>
