<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nouveau mot de passe · ISA ERP</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='252') }}"><link rel="stylesheet" href="{{ url_for('static', filename='colors.css', v='252') }}"></head><body class="login-page"><section class="login-card"><div class="brand"><span>ISA</span><small>ERP V25.2 · PASSWORD RESET</small></div><h1>Nouveau mot de passe</h1>{% if success %}<div class="flash">Mot de passe modifié avec succès.</div><p><a href="{{ url_for('login') }}">Se connecter maintenant</a></p>{% else %}{% if error %}<div class="flash">{{ error }}</div>{% endif %}<p>Choisissez une nouvelle clé d’au moins 8 caractères.</p><form method="post" id="reset-form"><input type="hidden" name="access_token"><input type="hidden" name="refresh_token"><label><span>Nouveau mot de passe</span><input type="password" name="password" minlength="8" required autofocus></label><label><span>Confirmer le mot de passe</span><input type="password" name="password_confirmation" minlength="8" required></label><button class="primary">Modifier le mot de passe</button></form><p class="login-help"><a href="{{ url_for('forgot_password') }}">Demander un nouveau lien</a></p><script>const params=new URLSearchParams(location.hash.slice(1));document.querySelector('[name="access_token"]').value=params.get('access_token')||'';document.querySelector('[name="refresh_token"]').value=params.get('refresh_token')||'';</script>{% endif %}</section></body></html>
